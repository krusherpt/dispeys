[package]
name = "dispeys-hid"
version = "0.1.0"
edition = "2024"

[dependencies]
hidapi = { version = "2.6", features = ["linux-static-hidraw"] }
log = "0.4"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
